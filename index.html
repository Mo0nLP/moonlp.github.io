
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>moonlp</title>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        body {
            background-color: purple;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
        }

        h1 {
            margin-top: 20px;
        }

        .game-section {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 20px;
            margin: 20px;
            flex-wrap: wrap;
        }

        .right-img {
            width: auto;
            height: auto;
            max-width: none;
        }

        .game-box {
            width: 320px;
            flex-shrink: 0;
            text-align: center;
        }

        #player {
            width: 320px;
            height: 480px;
            background: black;
        }

        #player ruffle-player {
            width: 320px;
            height: 480px;
            display: block;
        }

        .banana {
            position: fixed;
            width: 80px;
            bottom: 10px;
            left: 0;
            animation: bounce 2s infinite alternate ease-in-out;
        }

        @keyframes bounce {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(200px);
            }
        }
    </style>
</head>

<body>

    <h1>moonlp</h1>

    <marquee>
        Welcome to my website!
    </marquee>

    <h2>About me</h2>
    <p>Hello, welcome to my website!</p>

    <h2>My PC</h2>
    <p>Here are my PC specifications.</p>

    <div class="game-section">

        <img
            src="dvajaspity roboši.png"
            class="right-img"
            alt="dvajaspity roboši"
        >

        <div class="game-box">
            <h2>Scuft flappy bird</h2>
            <div id="player"></div>
        </div>

    </div>

    <img
        src="banana.gif"
        class="banana"
        alt="Banana"
    >

    <script>
        window.RufflePlayer = window.RufflePlayer || {};

        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();

            const container = document.getElementById("player");

            container.appendChild(player);
            player.style.width = "320px";
            player.style.height = "480px";

            player.load("game.swf");
        });
    </script>

</body>
</html>
