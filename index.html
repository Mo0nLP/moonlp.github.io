<!DOCTYPE html>
<html>

<body>

    <h1 style="text-align:center;">Seruste </h1>




<style>
.ticker {
  width: 100%;
  overflow: hidden
}

.ticker-text {
  display: inline-block;
  white-space: nowrap;
  padding-left: 100%;
  animation: scroll 20s linear infinite;
}

@keyframes scroll {
  0% {
    transform: translateX(0%);
  }
  100% {
    transform: translateX(-100%);
  }
}
</style>
</head>

<body>

<div class="ticker">
  <div class="ticker-text">
     Pozor na duby, môžu ťa zadupať  •   Myši nemajú demokratické voľby    •   MoonLP je ludska bytosť ako ty    •    MoonLP ovláda tu to stránku   •   viac spi , hraj menej         
  </div>
</div>


    
</head>
<body style="background:Purple; color:white; overflow:hidden;">


    <img id="banana"
         src="https://media.giphy.com/media/IB9foBA4PVkKA/giphy.gif"
         style="position:absolute; width:150px;">

    <script>
        let banana = document.getElementById("banana");

        let x = 100;
        let y = 100;
        let dx = 2;
        let dy = 2;

        function moveBanana() {
            let width = window.innerWidth - 150;
            let height = window.innerHeight - 150;

            x += dx;
            y += dy;

            if (x <= 0 || x >= width) dx *= -1;
            if (y <= 0 || y >= height) dy *= -1;

            banana.style.left = x + "px";
            banana.style.top = y + "px";

            requestAnimationFrame(moveBanana);
        }

        moveBanana();
    </script>
    
</body>
</html>
