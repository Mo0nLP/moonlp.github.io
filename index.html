
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>moonlp</title>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        body {
            background-color: purple;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        .main-content {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 25px;
            flex-wrap: nowrap;
            margin: 20px;
            overflow-x: auto;
        }

        .about-section {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            text-align: left;
            flex-shrink: 0;
        }

        .about-text {
            width: 250px;
        }

        .right-img {
            display: block;
            width: auto;
            height: auto;
        }

        .game-box {
            width: 320px;
            flex: 0 0 320px;
            text-align: center;
        }

        #player {
            width: 320px;
            height: 480px;
            background: black;
        }

        #player ruffle-player {
            width: 320px;
            height: 480px;
            display: block;
        }

        .banana {
            position: fixed;
            width: 80px;
            bottom: 10px;
            left: 0;
            animation: bounce 2s infinite alternate ease-in-out;
        }

        @keyframes bounce {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(200px);
            }
        }
    </style>
</head>

<body>

    <h1>moonlp</h1>

    <marquee>
        Welcome to my website!
    </marquee>

    <div class="main-content">

        <div class="about-section">

            <div class="about-text">
                <h2>Info about me</h2>
                <p>
                    Hello! Welcome to my website.
                </p>
            </div>

            <img class="right-img" src="dvajaspity roboši.png">

        </div>

        <div class="game-box">
            <h2>Scuft flappy bird</h2>
            <div id="player"></div>
        </div>

    </div>

    <h2>My PC</h2>
    <p>Here are my PC specifications.</p>

    <img src="banana.gif" class="banana" alt="Banana">

    <script>
        window.RufflePlayer = window.RufflePlayer || {};

        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();

            const container = document.getElementById("player");

            container.appendChild(player);

            player.style.width = "320px";
            player.style.height = "480px";

            player.load("game.swf");
        });
    </script>

</body>
</html>
