
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>moonlp</title>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        body {
            background-color: purple;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .main-content {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 25px;
            margin: 20px;
        }

        .about-section {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            text-align: left;
        }

        .about-text {
            text-align: left;
        }

        /* Obrázok má pôvodnú veľkosť */
        .right-img {
            display: block;
        }

        .game-box {
            width: 320px;
            flex-shrink: 0;
        }

        #player {
            width: 320px;
            height: 480px;
            background: black;
        }

        #player ruffle-player {
            width: 320px;
            height: 480px;
            display: block;
        }

        .banana {
            position: fixed;
            width: 80px;
            bottom: 10px;
            left: 0;
            animation: bounce 2s infinite alternate ease-in-out;
        }

        @keyframes bounce {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(200px);
            }
        }
    </style>
</head>

<body>

    <h1>moonlp</h1>

    <marquee>
        MoonLP je ľudská bytosť ako ty |
        MoonLP ovláda túto stránku
    </marquee>

    <div class="main-content">

        <div class="about-section">

            <div class="about-text">
                <h2>Info about me</h2>

                <p>Moje meno : Miško</p>
                <p>Čo som : Som živá bytosť</p>
                <p>Pohlavie : Muž</p>
                <p>Kde ma vieš stretnúť : Discord, Steam</p>
                <p>Nickname (Steam, Discord): MichalLP, MoonLP</p>
            </div>

            <img class="right-img" src="dvajaspity roboši.png">

        </div>

        <div class="game-box">
            <h2>Scuft flappy bird</h2>
            <div id="player"></div>
        </div>

    </div>

    <h2>My PC</h2>

    <!-- Sem patria tvoje pôvodné PC špecifikácie -->

    <img src="banana.gif" class="banana" alt="Banana">

    <script>
        window.RufflePlayer = window.RufflePlayer || {};

        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();

            document.getElementById("player").appendChild(player);

            player.style.width = "320px";
            player.style.height = "480px";

            player.load("game.swf");
        });
    </script>

</body>
</html>
