<!DOCTYPE html>
<html>
<head>
    <title>moonlp</title>
</head>
<body>

    <h1 style="text-align:center;">Seruste </h1>

    
    <h1>CS2 EXEC VIEWER</h1>

    <textarea id="input" rows="10" cols="50" placeholder="Sem vlož svoj exec.cfg..."></textarea>
    <br><br>

    <button onclick="showExec()">EXEC</button>

    <pre id="output"></pre>

    <script>
        function showExec() {
            let exec = document.getElementById("input").value;
            document.getElementById("output").innerText = exec;
        }
    </script>


    
</head>
<body style="background:Tail; color:white; overflow:hidden;">


    <img id="banana"
         src="https://media.giphy.com/media/IB9foBA4PVkKA/giphy.gif"
         style="position:absolute; width:150px;">

    <script>
        let banana = document.getElementById("banana");

        let x = 100;
        let y = 100;
        let dx = 2;
        let dy = 2;

        function moveBanana() {
            let width = window.innerWidth - 150;
            let height = window.innerHeight - 150;

            x += dx;
            y += dy;

            if (x <= 0 || x >= width) dx *= -1;
            if (y <= 0 || y >= height) dy *= -1;

            banana.style.left = x + "px";
            banana.style.top = y + "px";

            requestAnimationFrame(moveBanana);
        }

        moveBanana();
    </script>
    
</body>
</html>
